name: Release & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Forçar deploy na Vercel (Ignora testes e tag)?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # ==========================================
  # JOB 1: AVALIAR E GERAR VERSÃO (TAG)
  # ==========================================
  release:
    name: 📦 Semantic Release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "ℹ️ Log: Informações do Ambiente"
        run: |
          echo "==== DADOS DO AMBIENTE ===="
          echo "Repositório: ${{ github.repository }}"
          echo "Branch Acionada: ${{ github.ref_name }}"
          echo "Hash do Commit: ${{ github.sha }}"
          echo "==========================="

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: 📦 Instalar dependências
        run: |
          echo "Iniciando a instalação via npm ci..."
          npm ci --legacy-peer-deps

      - name: 🏷️ Avaliar e Gerar Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: "📋 Log: Resumo da Execução"
        run: |
          if [ "${{ steps.semantic.outputs.new_release_published }}" == "true" ]; then
            echo "### 🚀 Release Gerada com Sucesso!" >> $GITHUB_STEP_SUMMARY
            echo "- **Versão:** v${{ steps.semantic.outputs.new_release_version }}" >> $GITHUB_STEP_SUMMARY
            echo "- A pipeline agora irá bifurcar: Deploy para Vercel e Bateria de Testes em paralelo." >> $GITHUB_STEP_SUMMARY
            echo "Nova versão (v${{ steps.semantic.outputs.new_release_version }}) detectada. Preparando próximos jobs..."
          else
            echo "### ⏸️ Nenhuma release gerada" >> $GITHUB_STEP_SUMMARY
            echo "- Os commits deste push não exigem uma nova versão (ex: chore, docs)." >> $GITHUB_STEP_SUMMARY
            echo "- **Deploy e Testes cancelados.**" >> $GITHUB_STEP_SUMMARY
            echo "Nenhuma tag nova. A pipeline será encerrada aqui com sucesso."
          fi

  # ==========================================
  # JOB 2: DEPLOY NA VERCEL
  # ==========================================
  # ==========================================
  # JOB 2: DEPLOY NA VERCEL
  # (Roda logo após a Release, independente dos testes)
  # ==========================================
  deploy:
    name: 🔺 Deploy Vercel
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.published == 'true' || github.event.inputs.force_deploy == 'true'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: "ℹ️ Log: Início do Deploy"
        run: |
          echo "==== INICIANDO DEPLOY ===="
          echo "Versão Alvo: v${{ needs.release.outputs.version }}"
          echo "Ambiente: Production"
          echo "=========================="

      - name: 🛠️ Instalar Vercel CLI
        run: npm install --global vercel

      - name: 🔗 Conectar ao Projeto Vercel (Setup)
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🔐 Injetar Secrets do GitHub no Build (Fail-Safe)
        run: |
          echo "Gerando .env.production com segurança via EOF..."
          
          # O EOF (Heredoc) impede que caracteres especiais quebrem a injeção
          cat << 'EOF' > .env.production
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          EOF
          
          # Validação rápida sugerida pelo bot (Fail-fast validation)
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ]; then
            echo "❌ ERRO: VITE_SUPABASE_URL não encontrada no GitHub Secrets."
            exit 1
          fi

      - name: 🏗️ Build dos Artefatos
        run: |
          echo "Construindo aplicação na nuvem do GitHub Actions..."
          vercel build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🚀 Publicar na Vercel
        run: |
          echo "Enviando build pronto para a Vercel..."
          vercel deploy --prebuilt --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: "📋 Log: Resumo do Deploy"
        run: |
          echo "### 🔺 Deploy na Vercel: SUCESSO" >> $GITHUB_STEP_SUMMARY
          echo "Sua aplicação (v${{ needs.release.outputs.version }}) já está no ar!" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # JOB 3: TESTES UNITÁRIOS
  # ==========================================
  unit-tests:
    name: 🃏 Testes Unitários
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.published == 'true'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: "ℹ️ Log: Início dos Testes"
        run: echo "Iniciando validação do código fonte (v${{
          needs.release.outputs.version }})..."

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: 📦 Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: 🧪 Executar Vitest
        run: |
          echo "Rodando script 'npm run test'..."
          npm run test

      - name: "📋 Log: Resumo Unitários"
        run: |
          echo "### 🃏 Testes Unitários: APROVADOS" >> $GITHUB_STEP_SUMMARY
          echo "O código base está íntegro. Liberando a máquina virtual para iniciar o Playwright (E2E)." >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # JOB 4: TESTES E2E (PLAYWRIGHT)
  # ==========================================
  e2e-tests:
    name: 🎭 Testes E2E
    runs-on: ubuntu-latest
    needs: [ release, unit-tests ]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: "ℹ️ Log: Preparação E2E"
        run: echo "Preparando ambiente para simulação de usuário na versão v${{
          needs.release.outputs.version }}..."

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: 📦 Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: 🔐 Injetar Secrets do GitHub no Build (Fail-Safe)
        run: |
          echo "Gerando .env.production com segurança via EOF..."
          
          cat << 'EOF' > .env.production
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          EOF
          
          # Validação rápida sugerida pelo bot (Fail-fast validation)
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ]; then
            echo "❌ ERRO: VITE_SUPABASE_URL não encontrada no GitHub Secrets."
            exit 1
          fi

      - name: 🏗️ Build do Projeto
        run: |
          echo "Realizando build local para servir os arquivos estáticos ao Playwright..."
          npm run build

      - name: 🌐 Instalar Navegadores (Playwright)
        run: |
          echo "Baixando Chromium e dependências do Ubuntu (--with-deps)..."
          npx playwright install --with-deps chromium

      - name: 🎭 Executar Playwright
        run: |
          echo "Iniciando testes E2E com Playwright..."
          npm run e2e

      - name: "📋 Log: Resumo E2E"
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "### 🎭 Testes E2E: APROVADOS" >> $GITHUB_STEP_SUMMARY
            echo "A simulação de usuário ocorreu sem quebras visuais ou de fluxo." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Testes E2E: FALHARAM" >> $GITHUB_STEP_SUMMARY
            echo "Ocorreu um erro durante a execução do Playwright. Verifique o log detalhado." >> $GITHUB_STEP_SUMMARY
          fi
